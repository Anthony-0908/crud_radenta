<mat-sidenav-container class="sidenav-container">
  <!-- Sidenav -->
  <mat-sidenav #sidenav mode="over" [(opened)]="isOpened" class="custom-sidenav">
    <div class="sidenav-header">
      <!-- Close Button Inside Sidenav -->
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>close</mat-icon> <!-- Close button inside sidenav -->
      </button>
    </div>

    <!-- Navigation Content Inside Sidenav -->
    <div  class="sidenav-navigation">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content>
    <!-- Hamburger Menu (Always Visible) -->
    <button mat-icon-button (click)="toggleSidenav()" class="hamburger-menu">
      <mat-icon >menu</mat-icon> <!-- Show hamburger menu when closed -->

    </button>

    <div class="main-content">
      <!-- Main Content Goes Here -->
      Main Content
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
