<div class="h-screen flex flex-col bg-blue-500">

  <!-- Header -->
  <div class="bg-blue-600 text-white">
    <mat-toolbar>
      <app-header></app-header>
    </mat-toolbar>
  </div>

  <div class="relative flex">
    <!-- Sidebar -->
    <div
      class="fixed top-0 left-0 h-full w-64 bg-blue-500 text-black transform transition-transform duration-300"
      x-data="{ open: true }"
      :class="{ '-translate-x-full': !open }">
      <div class="bg-blue-600 h-full">
        <app-side-navbar></app-side-navbar>
      </div>
    </div>

    <div class="flex-1 p-4 bg-slate-200">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Footer -->
  <div class="bg-gray-700 text-white">
    <mat-toolbar class="justify-center">
      <app-footer></app-footer>
    </mat-toolbar>
  </div>
</div>
